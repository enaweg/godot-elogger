name: CI-PR

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Build
        working-directory: src/elogger
        run: dotnet build eLogger.sln --configuration Debug

      # Exported games compile without TOOLS, so editor-only ePlugin code is absent there. The Debug build above
      # cannot catch a runtime source that still depends on it.
      - name: Build exported game configurations
        working-directory: src/elogger
        run: |
          dotnet build eLogger.sln --configuration ExportDebug
          dotnet build eLogger.sln --configuration ExportRelease

      - name: Rebuild Godot project cache
        working-directory: src/elogger
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/elogger
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test eLogger.sln --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1
