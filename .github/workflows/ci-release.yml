name: CI-Release

on:
  push:
    tags:
      - "v*"

jobs:
  draft-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 200
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Setup Godot .NET
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true

      - name: Configure Godot test executable
        shell: bash
        run: echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb

      - name: Build
        working-directory: src/elogger
        run: dotnet build eLogger.sln --configuration Debug

      # Exported games compile without TOOLS, so editor-only ePlugin code is absent there. The Debug build above
      # cannot catch a runtime source that still depends on it.
      - name: Build exported game configurations
        working-directory: src/elogger
        run: |
          dotnet build eLogger.sln --configuration ExportDebug
          dotnet build eLogger.sln --configuration ExportRelease

      - name: Rebuild Godot project cache
        working-directory: src/elogger
        run: |
          "$GODOT_BIN" --path . --editor --headless --quit-after 2000

      - name: Run tests
        working-directory: src/elogger
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" \
            dotnet test eLogger.sln --configuration Debug --no-build --settings .runsettings --verbosity normal -m:1

      - name: Initialize version
        shell: bash
        run: |
          # The tag without its leading v, prerelease suffix included (v1.2.0-beta.1 -> 1.2.0-beta.1), so the
          # released plugin.cfg is a prerelease to the ePlugin updater as well.
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Writes the version into plugin.cfg, hides src as .src again and zips addons/eLogger as the release asset.
      - name: Create artifact
        shell: bash
        run: bash .github/scripts/package-addon.sh "out/eLogger-v${VERSION}.zip" "${VERSION}"

      # Builds the asset in a fresh project, as installed and as enabled, against the oldest supported Godot and the
      # pinned one, so a release that does not compile for its users is never published.
      - name: Build a consumer project from the artifact
        shell: bash
        env:
          # The oldest Godot eLogger supports (see CLAUDE.md): Godot.Logger was first exposed to scripting in 4.5.
          MIN_GODOT_VERSION: 4.5.0
        run: |
          pinned="$(sed -n 's|.*Godot\.NET\.Sdk/\([^"]*\)".*|\1|p' src/elogger/eLogger.csproj)"
          bash .github/scripts/check-consumer-build.sh "out/eLogger-v${VERSION}.zip" "$MIN_GODOT_VERSION" "$pinned"

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v6.5.0
        with:
          mode: "HYBRID"
          configurationJson: |
            {
               "template": "#{{CHANGELOG}}\n",
               "categories": [
                 {
                     "title": "## Feature",
                     "labels": ["feat", "feature"]
                 },
                 {
                     "title": "## Fix",
                     "labels": ["fix", "bug"]
                 },
                 {
                     "title": "## Other",
                     "labels": []
                 }
               ],
               "ignore_labels": [
                 "ignore"
               ],
               "label_extractor": [
                 {
                   "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                   "on_property": "title",
                   "target": "$1"
                 }
               ],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "v(.+)",
                  "flags": "gu"
                }
              }
             }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: "eLogger-v${{ env.VERSION }}"
          body: ${{ steps.build_changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
          artifacts: "out/eLogger-v${{ env.VERSION }}.zip"
